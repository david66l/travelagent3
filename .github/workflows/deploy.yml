name: Deploy

# Build production images, scan them, update immutable GitOps tags, and trigger
# ArgoCD only after the unified CI workflow has succeeded on main.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/travelagent
  ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
  ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}

jobs:
  # -------------------------------------------------------------------------
  # Build & push all service images
  # -------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.actor.login != 'github-actions[bot]')
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set image tag
        id: meta
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.environment }}-${SOURCE_SHA}"
          else
            VERSION="${SOURCE_SHA}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/travel-agent-backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/travel-agent-frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push gateway
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/travel-agent-gateway:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image for fixable high/critical CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/travel-agent-backend:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image for fixable high/critical CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/travel-agent-frontend:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan gateway image for fixable high/critical CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/travel-agent-gateway:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # -------------------------------------------------------------------------
  # Update image tags in K8s manifests and commit back (GitOps)
  # -------------------------------------------------------------------------
  update-manifests:
    name: Update K8s Manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Update image tags
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          SOURCE_SHA: ${{ needs.build-and-push.outputs.source_sha }}
        run: |
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [ "$CURRENT_SHA" != "$SOURCE_SHA" ]; then
            echo "Refusing stale deploy: built $SOURCE_SHA but main is $CURRENT_SHA" >&2
            exit 1
          fi
          sed -i \
            "s|image: ghcr.io/travelagent/travel-agent-backend:.*|image: ghcr.io/travelagent/travel-agent-backend:${IMAGE_TAG}|g" \
            k8s/backend-deployment.yaml k8s/celery-worker-deployment.yaml \
            k8s/celery-beat-deployment.yaml k8s/vrp-solver-deployment.yaml \
            k8s/migration-job.yaml
          sed -i \
            "s|image: ghcr.io/travelagent/travel-agent-frontend:.*|image: ghcr.io/travelagent/travel-agent-frontend:${IMAGE_TAG}|g" \
            k8s/frontend-deployment.yaml
          sed -i \
            "s|image: ghcr.io/travelagent/travel-agent-gateway:.*|image: ghcr.io/travelagent/travel-agent-gateway:${IMAGE_TAG}|g" \
            k8s/gateway-deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi
          git commit -m "chore(k8s): deploy ${{ needs.build-and-push.outputs.image_tag }} [skip ci]"
          git push

  # -------------------------------------------------------------------------
  # Trigger ArgoCD sync
  # -------------------------------------------------------------------------
  argocd-sync:
    name: ArgoCD Sync
    runs-on: ubuntu-latest
    needs: [build-and-push, update-manifests]
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Install ArgoCD CLI
        run: |
          ARGOCD_VERSION="v3.5.2"
          curl -fsSLo /tmp/argocd-linux-amd64 \
            "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-amd64"
          curl -fsSLo /tmp/cli_checksums.txt \
            "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/cli_checksums.txt"
          (cd /tmp && grep ' argocd-linux-amd64$' cli_checksums.txt | sha256sum --check --strict)
          install -m 0755 /tmp/argocd-linux-amd64 /tmp/argocd

      - name: Sync application
        run: |
          APP_NAME="travel-agent-${{ github.event.inputs.environment || 'production' }}"
          /tmp/argocd app sync "$APP_NAME" --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --prune
          /tmp/argocd app wait "$APP_NAME" --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --health
