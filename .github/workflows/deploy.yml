name: Deploy

# Build production images, push to registry, and trigger ArgoCD sync (M5).
# Runs automatically on main branch pushes, or manually via workflow_dispatch.
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/travelagent
  ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
  ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}

jobs:
  # -------------------------------------------------------------------------
  # Build & push all service images
  # -------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.environment }}-${{ github.sha }}"
          else
            VERSION="${{ github.sha }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/travel-agent-backend:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/travel-agent-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/travel-agent-frontend:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/travel-agent-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push gateway
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/travel-agent-gateway:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/travel-agent-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push vLLM
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.vllm
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/travel-agent-vllm:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/travel-agent-vllm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # Update image tags in K8s manifests and commit back (GitOps)
  # -------------------------------------------------------------------------
  update-manifests:
    name: Update K8s Manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          sed -i \
            "s|image: ghcr.io/travelagent/travel-agent-backend:.*|image: ghcr.io/travelagent/travel-agent-backend:${IMAGE_TAG}|g" \
            k8s/backend-deployment.yaml k8s/celery-worker-deployment.yaml k8s/celery-beat-deployment.yaml
          sed -i \
            "s|image: ghcr.io/travelagent/travel-agent-frontend:.*|image: ghcr.io/travelagent/travel-agent-frontend:${IMAGE_TAG}|g" \
            k8s/frontend-deployment.yaml
          sed -i \
            "s|image: ghcr.io/travelagent/travel-agent-gateway:.*|image: ghcr.io/travelagent/travel-agent-gateway:${IMAGE_TAG}|g" \
            k8s/gateway-deployment.yaml
          sed -i \
            "s|image: ghcr.io/travelagent/travel-agent-vllm:.*|image: ghcr.io/travelagent/travel-agent-vllm:${IMAGE_TAG}|g" \
            k8s/vllm-deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi
          git commit -m "chore(k8s): deploy ${{ needs.build-and-push.outputs.image_tag }}"
          git push

  # -------------------------------------------------------------------------
  # Trigger ArgoCD sync
  # -------------------------------------------------------------------------
  argocd-sync:
    name: ArgoCD Sync
    runs-on: ubuntu-latest
    needs: [build-and-push, update-manifests]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /tmp/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /tmp/argocd

      - name: Sync application
        run: |
          APP_NAME="travel-agent-${{ github.event.inputs.environment || 'production' }}"
          /tmp/argocd app sync "$APP_NAME" --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --prune
          /tmp/argocd app wait "$APP_NAME" --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --health
