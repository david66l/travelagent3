name: CI

# Unified lint + test + build pipeline for TravelAgent2 (M5).
# Triggers on every push/PR to main and on changes to any service.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/travelagent

jobs:
  # -------------------------------------------------------------------------
  # Backend: lint, type check, unit tests, security scan
  # -------------------------------------------------------------------------
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: travelagent
          POSTGRES_PASSWORD: travelagent123
          POSTGRES_DB: travel_agent
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.x"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev,mlflow]"

      - name: Lint (Ruff)
        run: uv run ruff check src/ tests/

      - name: Format check (Ruff)
        run: uv run ruff format --check src/ tests/

      - name: Type check (MyPy)
        run: uv run mypy src/ --ignore-missing-imports

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://travelagent:travelagent123@localhost:5432/travel_agent
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: sk-test-mock
          JWT_SECRET: ci-test-secret-not-for-production
        run: uv run pytest tests/ -q --cov=src --cov-report=xml --cov-report=term

      - name: Security scan (Bandit)
        run: uv run bandit -r src/ -ll

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  # -------------------------------------------------------------------------
  # Frontend: lint, type check, build
  # -------------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_SSE_URL: /api/v1/chat/stream
        run: npm run build

  # -------------------------------------------------------------------------
  # Gateway: lint, test, build
  # -------------------------------------------------------------------------
  gateway-ci:
    name: Gateway CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: ./gateway/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ./gateway
          args: --timeout=5m

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o /tmp/gateway ./cmd/gateway

  # -------------------------------------------------------------------------
  # Docker build (no push) to ensure all images are buildable
  # -------------------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, gateway-ci]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ${{ env.IMAGE_PREFIX }}/travel-agent-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ${{ env.IMAGE_PREFIX }}/travel-agent-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: false
          tags: ${{ env.IMAGE_PREFIX }}/travel-agent-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build vLLM image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.vllm
          push: false
          tags: ${{ env.IMAGE_PREFIX }}/travel-agent-vllm:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
