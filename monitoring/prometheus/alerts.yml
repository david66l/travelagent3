groups:
  - name: travel-agent
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[5m])) /
          sum(rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Backend 5xx rate > 5%"
      - alert: HighP99Latency
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "HTTP P99 latency > 2s"
      - alert: PlanningJobFailures
        expr: increase(planning_jobs_failed_total[15m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Planning job failures spiking"
      - alert: CostCircuitBreakerActive
        expr: cost_circuit_breaker_active == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Global cost circuit breaker is active — LLM degraded to small model"
      - alert: DailyTokenBudgetHigh
        expr: cost_daily_tokens_total > 40000000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Daily LLM token consumption approaching global budget"
      - alert: DailyExternalApiCostHigh
        expr: cost_daily_external_api_cny > 800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Daily external API cost estimate exceeds 800 CNY"
      - alert: HighFallbackRate
        expr: |
          sum(rate(fallback_total[5m])) /
          (sum(rate(external_api_calls_total[5m])) + sum(rate(fallback_total[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "External dependency fallback rate > 50%"
      - alert: HighSolveLatency
        expr: histogram_quantile(0.99, sum(rate(solve_latency_seconds_bucket[5m])) by (le)) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Itinerary solver P99 latency > 10s"
      - alert: HighRetrievalLatency
        expr: histogram_quantile(0.99, sum(rate(retrieval_latency_seconds_bucket[5m])) by (le)) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RAG retrieval P99 latency > 3s"
      - alert: TooManyActiveSessions
        expr: active_sessions > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Active SSE sessions exceed 1000"
      - alert: DependencyUnhealthy
        expr: |
          sum by (name) (
            label_replace(up{job=~"backend|gateway"}, "name", "$1", "instance", "(.*)")
          ) < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Core dependency health check failing"
      - alert: AgentSemanticFailureRateHigh
        expr: |
          sum(rate(agent_terminal_outcomes_total{outcome="failed"}[10m])) /
          clamp_min(sum(rate(agent_terminal_outcomes_total[10m])), 0.001) > 0.10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Agent terminal failure rate exceeds 10%"
      - alert: AgentClarificationRateHigh
        expr: |
          sum(rate(agent_terminal_outcomes_total{outcome="clarify"}[15m])) /
          clamp_min(sum(rate(agent_terminal_outcomes_total[15m])), 0.001) > 0.40
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Agent clarification rate exceeds 40%; inspect intent or retrieval quality"
      - alert: PlanningNotificationFailures
        expr: increase(planning_job_notification_failures_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Redis notifications are failing after durable DB commits"
      - alert: PlanningRetryExhausted
        expr: increase(planning_task_retry_outcomes_total{outcome="exhausted"}[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "At least one planning task exhausted its retry budget"
      - alert: SessionLockContentionHigh
        expr: |
          histogram_quantile(0.99,
            sum(rate(session_run_lock_wait_seconds_bucket{outcome="acquired"}[10m])) by (le)
          ) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Per-conversation serialization lock P99 wait exceeds 5 seconds"
      - alert: IdempotencyConflictSpike
        expr: increase(chat_idempotency_total{outcome="conflict"}[10m]) > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Idempotency-key conflicts spiking; inspect client reuse or abuse"
