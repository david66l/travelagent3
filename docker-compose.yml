services:
  postgres:
    image: ankane/pgvector:latest
    container_name: travel_agent_postgres
    environment:
      POSTGRES_USER: travelagent
      POSTGRES_PASSWORD: travelagent123
      POSTGRES_DB: travel_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelagent -d travel_agent"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - travel_agent_network

  redis:
    image: redis:7-alpine
    container_name: travel_agent_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - travel_agent_network

  backend:
    image: travelagent2-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travel_agent_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://travelagent:travelagent123@postgres:5432/travel_agent
      REDIS_URL: redis://redis:6379/0
      VRP_SOLVER_URL: http://vrp_solver:8001
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vrp_solver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - travel_agent_network
    restart: unless-stopped

  vrp_solver:
    image: travelagent2-backend:latest
    container_name: travel_agent_vrp_solver
    command: python -m vrp_solver_service.main
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://travelagent:travelagent123@postgres:5432/travel_agent
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - travel_agent_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        INTERNAL_API_URL: http://backend:8000
    container_name: travel_agent_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ""
      # Next standalone otherwise binds to Docker's container-id hostname,
      # making localhost health checks fail despite the published port working.
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend
    networks:
      - travel_agent_network
    restart: unless-stopped

  celery_worker:
    image: travelagent2-backend:latest
    container_name: travel_agent_celery_worker
    command: celery -A core.celery_app worker -Q default,planning -l info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://travelagent:travelagent123@postgres:5432/travel_agent
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The shared backend image checks FastAPI on :8000; Celery does not expose
    # that port, so inheriting the image healthcheck would mark a healthy worker
    # as unhealthy.
    healthcheck:
      disable: true
    networks:
      - travel_agent_network
    restart: unless-stopped

  celery_beat:
    image: travelagent2-backend:latest
    container_name: travel_agent_celery_beat
    command: celery -A core.celery_app beat -l info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://travelagent:travelagent123@postgres:5432/travel_agent
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - travel_agent_network
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: travel_agent_gateway
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000
      FRONTEND_URL: http://frontend:3000
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - travel_agent_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  travel_agent_network:
    driver: bridge
