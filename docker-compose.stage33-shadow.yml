# Stage33 side-effect-isolated champion/challenger Shadow worker overlay.
# Usage:
#   docker build -f backend/Dockerfile.stage33 -t travelagent2-backend:stage33 backend
#   docker compose -f docker-compose.yml -f docker-compose.stage33-shadow.yml up -d --no-build

services:
  vrp_solver:
    image: travelagent2-backend:stage33

  backend:
    image: travelagent2-backend:stage33
    env_file:
      - .env
      - deploy/stage33-shadow.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://travelagent:travelagent123@postgres:5432/travel_agent
      REDIS_URL: redis://redis:6379/0
      VRP_SOLVER_URL: http://vrp_solver:8001
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

  celery_worker:
    image: travelagent2-backend:stage33
    command: celery -A core.celery_app worker -Q default,planning -l info

  celery_beat:
    image: travelagent2-backend:stage33

  celery_shadow_worker:
    image: travelagent2-backend:stage33
    container_name: travel_agent_celery_shadow_worker
    command: celery -A core.celery_app worker -Q shadow -l info --concurrency=1
    env_file:
      - .env
      - deploy/stage33-shadow.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://travelagent:travelagent123@postgres:5432/travel_agent
      REDIS_URL: redis://redis:6379/0
      VRP_SOLVER_URL: http://vrp_solver:8001
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vrp_solver:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - travel_agent_network
    restart: unless-stopped
