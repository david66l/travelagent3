worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # M1: gateway-level rate limit (IP); user-tier limits remain in FastAPI middleware.
    limit_req_zone $binary_remote_addr zone=api_ip:10m rate=60r/m;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location /health {
            proxy_pass http://backend_upstream/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        location /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        location /api/ {
            limit_req zone=api_ip burst=20 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header X-Request-ID $http_x_request_id;

            proxy_read_timeout 3600s;
            proxy_buffering off;
            proxy_pass http://backend_upstream;
        }

        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $http_x_request_id;
        }
    }
}
