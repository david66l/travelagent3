# Optional vLLM inference (M4). Requires NVIDIA GPU on the host.
# Usage: docker compose -f docker-compose.yml -f docker-compose.vllm.yml --profile vllm up -d
# Set VLLM_ENABLED=true and VLLM_BASE_URL=http://vllm:8000/v1 in backend .env

services:
  vllm:
    profiles: ["vllm"]
    image: vllm/vllm-openai:v0.9.2
    container_name: travel_agent_vllm
    command:
      - --model
      - Qwen/Qwen2.5-14B-Instruct
      - --served-model-name
      - Qwen2.5-14B-Instruct
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
    ports:
      - "8001:8000"
    networks:
      - travel_agent_network
