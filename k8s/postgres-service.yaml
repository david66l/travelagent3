# PostgreSQL Services (M5)
# "postgres" is the headless service required by the StatefulSet.
# "postgres-read" load-balances across replicas for read-only queries.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: travel-agent
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    ignore-check.kube-linter.io/dangling-service: >-
      StatefulSet pod-name labels are injected by Kubernetes at runtime.
  labels:
    app: postgres
    tier: datastore
    role: primary
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    statefulset.kubernetes.io/pod-name: postgres-0
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-read
  namespace: travel-agent
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    ignore-check.kube-linter.io/dangling-service: >-
      StatefulSet pod-name labels are injected by Kubernetes at runtime.
  labels:
    app: postgres
    tier: datastore
    role: replica
spec:
  type: ClusterIP
  selector:
    statefulset.kubernetes.io/pod-name: postgres-1
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
