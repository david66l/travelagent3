# PostgreSQL Services (M5)
# "postgres" is the headless service required by the StatefulSet.
# "postgres-read" load-balances across replicas for read-only queries.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: travel-agent
  labels:
    app: postgres
    tier: datastore
    role: primary
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-read
  namespace: travel-agent
  labels:
    app: postgres
    tier: datastore
    role: replica
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
