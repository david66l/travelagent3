apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: travel-agent
spec:
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16-alpine
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: travel-agent-secrets
                      key: POSTGRES_PASSWORD
                      optional: true
              command:
                - /bin/sh
                - -c
                - |
                  TS=$(date +%Y%m%d_%H%M%S)
                  pg_dump -h postgres -U travelagent travel_agent \
                    | gzip > /backup/travel_agent_${TS}.sql.gz
                  echo "backup complete: travel_agent_${TS}.sql.gz"
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: postgres-backup-pvc
