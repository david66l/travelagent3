# TravelAgent2 Secret template (M5)
# -----------------------------------------------------------------------------
# DO NOT COMMIT REAL SECRETS TO GIT.
# Replace placeholder values before applying, or use:
#   - External Secrets Operator (AWS Secrets Manager / Azure Key Vault / GCP SM)
#   - Sealed Secrets / SOPS
#   - CI/CD secret injection
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: travel-agent-secrets
  namespace: travel-agent
type: Opaque
stringData:
  # JWT signing secret — generate with: openssl rand -base64 48
  JWT_SECRET: "change-me-in-production-generate-with-openssl-rand-base64-48"

  # PostgreSQL async URL for FastAPI (PRD §16.1)
  DATABASE_URL: "postgresql+asyncpg://travelagent:change-me@postgres:5432/travel_agent"
  # Synchronous URL for Alembic / Celery sync tasks
  DATABASE_URL_SYNC: "postgresql://travelagent:change-me@postgres:5432/travel_agent"

  # Redis — overridden by ConfigMap for cluster mode; kept for compatibility
  REDIS_URL: "redis://redis-cluster:6379/0"

  # PostgreSQL superuser password
  POSTGRES_PASSWORD: "change-me-strong-postgres-password"
  POSTGRES_USER: "travelagent"
  POSTGRES_DB: "travel_agent"
  POSTGRES_REPLICATION_PASSWORD: "change-me-replication-password"

  # vLLM / OpenAI fallback
  VLLM_API_KEY: "not-needed"
  OPENAI_API_KEY: ""
  DEEPSEEK_API_KEY: ""

  # External APIs (PRD §16.1)
  AMAP_KEY: ""
  WEATHER_KEY: ""
  TAVILY_API_KEY: ""

  # Cost / quota alert webhook (PRD §4.7.4 / §4.10.5)
  ALERT_WEBHOOK_URL: ""
