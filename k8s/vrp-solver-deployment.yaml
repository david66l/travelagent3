# VRP Solver Microservice Deployment (M5)
# Standalone CP-SAT itinerary optimizer accessed by backend over HTTP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vrp-solver
  namespace: travel-agent
  labels:
    app: vrp-solver
    tier: solver
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vrp-solver
  template:
    metadata:
      labels:
        app: vrp-solver
        tier: solver
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vrp-solver
          image: ghcr.io/travelagent/travel-agent-backend:git-sha-required
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "vrp_solver_service.main"]
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: travel-agent-config
            - secretRef:
                name: travel-agent-secrets
          env:
            - name: PYTHONPATH
              value: "/app/src"
            - name: PROMETHEUS_MULTIPROC_DIR
              value: "/tmp/prometheus"
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - vrp-solver
                topologyKey: kubernetes.io/hostname
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 60
