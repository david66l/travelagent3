# Redis Cluster StatefulSet (M5)
# Topology: 3 masters + 3 replicas (PRD §4.7.6)
# - Headless Service "redis" provides stable pod DNS: redis-0.redis, redis-1.redis, ...
# - ClusterIP Service "redis-cluster" is the client seed endpoint.
# - A separate idempotent Sync-hook Job bootstraps the cluster after all six
#   Redis processes are reachable.  Bootstrap cannot run as an initContainer:
#   doing so prevents the Redis processes it waits for from ever starting.
#
# Persistence:
# - AOF everysec + RDB snapshots (mixed mode)
# - maxmemory 8 Gi per node, volatile-lru eviction
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: travel-agent
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app: redis
    tier: datastore
spec:
  serviceName: redis
  replicas: 6
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        tier: datastore
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6379"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Ensure master/replica pairs don't land on the same node
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - redis
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - redis
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: redis
          image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
          command:
            - redis-server
          args:
            - /etc/redis/redis.conf
          ports:
            - name: redis
              containerPort: 6379
            - name: cluster
              containerPort: 16379
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            # PRD §12.2 / §4.7.6: 1–2 CPU, 4–8 Gi per node; maxmemory 8 Gi
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 8Gi
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/redis
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: redis-config
            items:
              - key: redis.conf
                path: redis.conf
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
# Redis node configuration (cluster + persistence + memory policies)
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: travel-agent
data:
  redis.conf: |
    # Network
    port 6379
    bind 0.0.0.0
    protected-mode no

    # Cluster mode
    cluster-enabled yes
    cluster-config-file /data/nodes.conf
    cluster-node-timeout 5000
    cluster-require-full-coverage no

    # Persistence (mixed AOF + RDB)
    appendonly yes
    appendfsync everysec
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    save 900 1
    save 300 10
    save 60 10000

    # Memory
    maxmemory 8gb
    maxmemory-policy volatile-lru

    # Logging
    loglevel notice

    # Disable dangerous commands
    rename-command FLUSHALL ""
    rename-command FLUSHDB  ""
