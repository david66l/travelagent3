# -----------------------------------------------------------------------------
# Memory queue workers (archival / cleanup) — low concurrency, reliable
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker-memory
  namespace: travel-agent
  labels:
    app: celery-worker
    queue: memory
    tier: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
      queue: memory
  template:
    metadata:
      labels:
        app: celery-worker
        queue: memory
        tier: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/travelagent/travel-agent-backend:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - core.celery_app
            - worker
            - -Q
            - memory
            - -l
            - info
            - --concurrency
            - "2"
          envFrom:
            - configMapRef:
                name: travel-agent-config
            - secretRef:
                name: travel-agent-secrets
          env:
            - name: PYTHONPATH
              value: "/app/src"
          resources:
            # PRD §12.2: memory worker ~ Beat tier, 0.5–1 CPU, 512Mi–1 Gi
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 30"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 60
