    # Uncomment with Prometheus Adapter / custom-metrics-server:
    # - type: External
    #   external:
    #     metric:
    #       name: celery_queue_length
    #       selector:
    #         matchLabels:
    #           queue: poi
    #     target:
    #       type: AverageValue
    #       averageValue: "30"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
