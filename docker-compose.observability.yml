# Observability stack for local dev / staging (PRD §12.7)
# Usage: docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: travel_agent_prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - travel_agent_network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: travel_agent_alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - travel_agent_network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: travel_agent_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - travel_agent_network

  loki:
    image: grafana/loki:3.1.1
    container_name: travel_agent_loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - travel_agent_network

  jaeger:
    image: jaegertracing/all-in-one:1.61
    container_name: travel_agent_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - travel_agent_network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: travel_agent_otel_collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./monitoring/otel/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4319:4318"
    depends_on:
      - jaeger
    networks:
      - travel_agent_network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: travel_agent_mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5000:5000"
    networks:
      - travel_agent_network

  gateway:
    image: nginx:1.27-alpine
    container_name: travel_agent_gateway
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - backend
      - frontend
    networks:
      - travel_agent_network

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  mlflow_data:

networks:
  travel_agent_network:
    driver: bridge
